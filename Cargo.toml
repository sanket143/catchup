[package]
name = "catchup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
cookie = "0.18"
dotenvy = "0.15"
futures = "0.3"
juniper = "0.16"
lambda_http = "0.17"
lazy_static = "1.5"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
tokio = "1.47"
ureq = { version = "3.1", features = ["json"] }

[[bin]]
name = "catchup"
path = "src/bin/main.rs"
